name: certify-scintilla-daemon-e7a34a3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scintilla-daemon-e7a34a3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out carrier exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify mirrored Scintilla source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/scintilla-daemon-11cfc15/Cargo.toml)" = "56181422884abdd7fce98723e7d22359dea48e3c"
          test "$(git hash-object evidence/scintilla-daemon-11cfc15/.cli-flags.toml)" = "3643ccfe897e925285ddeaba897f15408cf564b3"
          test "$(git hash-object evidence/scintilla-daemon-11cfc15/src/flags.rs)" = "844faf2c93adcd3ed9083e578126904d2d316f4b"
          test "$(git hash-object evidence/scintilla-daemon-11cfc15/src/main.rs)" = "df69de78b7ece7083ead3f014d20070a1fdfdef2"
          echo "certifying scintilla-run/scintilla-desktop-daemon@e7a34a31066bd387550eae434ea729f46856923e"

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Generate deterministic lock candidate
        shell: bash
        run: cargo +1.90.0 generate-lockfile --manifest-path evidence/scintilla-daemon-11cfc15/Cargo.toml

      - name: Publish lock candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scintilla-daemon-e7a34a3-cargo-lock
          path: evidence/scintilla-daemon-11cfc15/Cargo.lock
          if-no-files-found: error

      - name: Format
        run: cargo +1.90.0 fmt --manifest-path evidence/scintilla-daemon-11cfc15/Cargo.toml -- --check

      - name: Clippy
        run: cargo +1.90.0 clippy --locked --manifest-path evidence/scintilla-daemon-11cfc15/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo +1.90.0 test --locked --manifest-path evidence/scintilla-daemon-11cfc15/Cargo.toml --all-targets
