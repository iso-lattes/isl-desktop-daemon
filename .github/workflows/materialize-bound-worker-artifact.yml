name: materialize-bound-worker-artifact

on:
  push:
    branches:
      - alexanderdmills/den-3045-bound-worker-artifact

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: alexanderdmills/den-3045-bound-worker-artifact
          persist-credentials: true
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Apply bounded artifact hardening
        run: python3 .github/materialize-bound-worker-artifact.py
      - name: Format
        run: cargo +1.90.0 fmt --all
      - name: Verify formatting
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --all-targets
      - name: Commit tested source and remove bootstrap files
        shell: bash
        run: |
          rm .github/workflows/materialize-bound-worker-artifact.yml .github/materialize-bound-worker-artifact.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs .github/workflows/materialize-bound-worker-artifact.yml .github/materialize-bound-worker-artifact.py
          git commit -m 'security: bound V8 worker artifact size before hashing'
          git push origin HEAD:alexanderdmills/den-3045-bound-worker-artifact
