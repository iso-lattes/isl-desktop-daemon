name: evidence-giw-current-main

on:
  pull_request:
    paths:
      - .github/workflows/evidence-giw-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact GIW CLI head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gha-indie-worker/giw-desktop-cli
          ref: b8876a142a240a84ea0dc7c0d37ea89c89680f64
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "b8876a142a240a84ea0dc7c0d37ea89c89680f64"
      - name: Install Rust 1.90
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify committed lockfile is usable
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          cargo +1.90.0 metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --exit-code -- Cargo.lock
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --all-targets --locked
      - name: Verify lockfile remained unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
