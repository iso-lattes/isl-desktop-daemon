name: evidence-giw-current-main

on:
  pull_request:
    paths:
      - .github/workflows/evidence-giw-current-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact GIW CLI head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gha-indie-worker/giw-desktop-cli
          ref: e9f2c2f841b968ec46551e2b401ab8b32023d02a
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "e9f2c2f841b968ec46551e2b401ab8b32023d02a"
      - name: Install Rust 1.90
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Generate deterministic lock candidate
        shell: bash
        run: cargo +1.90.0 generate-lockfile
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --all-targets --locked
      - name: Preserve lock candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giw-current-main-lock-e9f2c2f
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14