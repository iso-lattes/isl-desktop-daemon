name: evidence-lunatic-cli-v3

on:
  pull_request:
    paths:
      - .github/workflows/evidence-lunatic-cli-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact Lunatic CLI integrated head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lunatic-lorry/ll-desktop-cli
          ref: b16a7c1c87b074c9fb82d48cc95d289d0a9b2b0b
          persist-credentials: false
      - name: Install Rust 1.90
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "b16a7c1c87b074c9fb82d48cc95d289d0a9b2b0b"
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --all-targets
