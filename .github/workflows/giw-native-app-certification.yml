name: certify GIW native desktop app

on:
  pull_request:
    paths:
      - .github/workflows/giw-native-app-certification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact GIW native app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gha-indie-worker/gha-indie-worker-desktop-app.rs
          ref: 788de113187a2cadeede03c1eebb1549f29635c4
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "788de113187a2cadeede03c1eebb1549f29635c4"
      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - name: Fetch committed lockfile exactly
        shell: bash
        run: cargo +1.90.0 fetch --locked
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Check
        shell: bash
        run: cargo +1.90.0 check --locked --all-targets
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --locked --all-targets
      - name: Require deterministic committed lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --exit-code -- Cargo.lock
