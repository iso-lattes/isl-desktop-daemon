name: certify GIW native desktop app

on:
  pull_request:
    paths:
      - .github/workflows/giw-native-app-certification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact GIW native app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gha-indie-worker/gha-indie-worker-desktop-app.rs
          ref: d189e4375e5fd91eaf237c9fafdf63aada71806c
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d189e4375e5fd91eaf237c9fafdf63aada71806c"
      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - name: Generate deterministic lock candidate
        shell: bash
        run: cargo +1.90.0 generate-lockfile
      - name: Format
        shell: bash
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Check
        shell: bash
        run: cargo +1.90.0 check --locked --all-targets
      - name: Test
        shell: bash
        run: cargo +1.90.0 test --locked --all-targets
      - name: Preserve lock candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giw-native-app-lock-d189e437
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14
