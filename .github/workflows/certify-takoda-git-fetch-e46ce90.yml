name: certify-takoda-git-fetch-e46ce90

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-takoda-git-fetch-e46ce90-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact mirrored blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/tkda-git-fetch-e46ce90/Cargo.toml)" = "f9813209556c0cad03518f55f33463f4f36b1fd3"
          test "$(git hash-object evidence/tkda-git-fetch-e46ce90/lib.rs)" = "5639a0d37322e274a8acd75fb5298de06389d882"
          echo "certifying takoda-automation/tkda-sync@e46ce9009298984c1b1516ca07426cc99329e67c"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - name: Generate lock
        run: cargo generate-lockfile --manifest-path evidence/tkda-git-fetch-e46ce90/Cargo.toml
      - name: Format
        run: cargo fmt --manifest-path evidence/tkda-git-fetch-e46ce90/Cargo.toml -- --check
      - name: Check
        run: cargo check --locked --manifest-path evidence/tkda-git-fetch-e46ce90/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --locked --manifest-path evidence/tkda-git-fetch-e46ce90/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path evidence/tkda-git-fetch-e46ce90/Cargo.toml --all-targets
